
spring.application.name=EarthPulse AI
server.port=${PORT:8080}

# MySQL Database

spring.datasource.username=${DB_USERNAME}spring.datasource.url=${DB_URL:jdbc:mysql://mysql-1569c80f-gramtwin360.f.aivencloud.com:13754/earthpulseai_db?sslMode=REQUIRED}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# File Upload
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=16MB
app.upload-dir=${UPLOAD_DIR:uploads}

# Admin 1
app.admin.email=${APP_ADMIN_EMAIL}
app.admin.password=${APP_ADMIN_PASSWORD}

# Admin 2
app.admin2.email=${APP_ADMIN2_EMAIL}
app.admin2.password=${APP_ADMIN2_PASSWORD}

# Admin Security PIN
app.admin.pin-salt=${ADMIN_PIN_SALT}
app.admin.pin-hash=${ADMIN_PIN_HASH}

# AI Configuration
app.ai.api-key=${AI_API_KEY:}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
app.ai.model=${AI_MODEL:gpt-4o-mini}

# Sentinel Configuration
app.sentinel.client-id=${SENTINEL_CLIENT_ID:}
app.sentinel.client-secret=${SENTINEL_CLIENT_SECRET:}
app.sentinel.instance-id=${SENTINEL_INSTANCE_ID:}

# Thymeleaf
spring.thymeleaf.cache=false
