<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Future Simulator | EarthPulse AI</title><th:block th:replace="~{fragments/head :: head}"/></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="wrap app-main narrow"><div class="page-heading"><div><span class="eyebrow">PLANNING / WHAT-IF SCENARIOS</span><h1>Explore a <em>greener future.</em></h1><p>Adjust assumptions to estimate possible sustainability outcomes. Results are calculated instantly in your browser.</p></div></div>
<form id="simForm" class="panel form-panel"><label>Roof catchment area (m²)<input type="number" id="roofArea" value="100" min="0" max="100000"></label><label>Annual rainfall (mm)<input type="number" id="annualRainMm" value="700" min="0" max="5000"></label><label>Collection efficiency (0–1)<input type="number" id="efficiency" value="0.8" min="0" max="1" step="0.05"></label><label>Green cover increase (%)<input type="number" id="greenIncrease" value="10" min="0" max="100"></label><label>Waste reduction target (%)<input type="number" id="wasteReduction" value="15" min="0" max="100"></label><button class="btn btn-primary">Calculate scenario ↗</button></form>
<div id="simResults" class="metric-grid result-metrics" hidden><div class="metric-card"><span>ESTIMATED WATER HARVEST</span><b id="waterResult">—</b><small>litres / year</small></div><div class="metric-card"><span>GREEN COVER SCENARIO</span><b id="greenResult">—</b><small>entered change target</small></div><div class="metric-card"><span>WASTE REDUCTION SCENARIO</span><b id="wasteResult">—</b><small>entered target</small></div></div><p id="simNote" class="muted"></p></main><script src="/js/simulator.js"></script></body></html>
