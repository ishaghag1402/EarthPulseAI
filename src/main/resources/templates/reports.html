<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>My Reports | EarthPulse AI</title><th:block th:replace="~{fragments/head :: head}"/></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="wrap app-main"><div class="page-heading"><div><span class="eyebrow">COMMUNITY / TRACKING</span><h1>My <em>EcoReports.</em></h1><p>Follow the status of observations you submitted.</p></div><a class="btn btn-primary" href="/reports/new">＋ New report</a></div>
<div class="panel table-wrap"><table><thead><tr><th>Category</th><th>Description</th><th>Status</th><th>Submitted</th></tr></thead><tbody><tr th:each="r:${reports}"><td th:text="${r.category}"></td><td th:text="${r.description}"></td><td><span class="status" th:text="${r.status}"></span></td><td th:text="${#temporals.format(r.createdAt,'dd MMM yyyy')}"></td></tr></tbody></table><div class="empty-state" th:if="${#lists.isEmpty(reports)}">No reports found yet.</div></div></main></body></html>
