<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Login | EarthPulse AI</title><th:block th:replace="~{fragments/head :: head}"/></head><body class="auth-page"><div th:replace="~{fragments/nav :: nav}"></div>
<main class="auth-wrap"><div class="auth-aside"><span class="eyebrow">WELCOME BACK</span><h1>Your world.<br><em>In better focus.</em></h1><p>Sign in to continue exploring environmental signals and community insights.</p><div class="auth-art">⌖<span>OBSERVE · UNDERSTAND · ACT</span></div></div>
<form class="auth-card" th:action="@{/login}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><span class="eyebrow">SIGN IN</span><h2>Welcome back</h2><p class="muted" th:if="${param.error}">Email or password is incorrect.</p><p class="success" th:if="${registered}">Account created. You can sign in now.</p>
<label>Email address<input type="email" name="username" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" required placeholder="Your password"></label>
<button class="btn btn-primary btn-full" type="submit">Sign in ↗</button><p class="auth-switch">New to EarthPulse? <a href="/register">Create account</a></p></form></main></body></html>
