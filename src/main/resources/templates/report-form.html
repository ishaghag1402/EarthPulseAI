<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>New EcoReport | EarthPulse AI</title><th:block th:replace="~{fragments/head :: head}"/></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="wrap app-main narrow">
<div class="page-heading"><div><span class="eyebrow">COMMUNITY / NEW OBSERVATION</span><h1>Submit an <em>EcoReport.</em></h1><p>Share a local environmental observation for review.</p></div></div>
<form class="panel form-panel" action="/reports" method="post" enctype="multipart/form-data"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<label>Report category<select name="category" required><option>Water quality</option><option>Waste management</option><option>Air quality</option><option>Green cover / trees</option><option>Drainage / flooding</option><option>Infrastructure</option><option>Other</option></select></label>
<label>What did you observe?<textarea name="description" rows="5" maxlength="1000" required placeholder="Describe what you observed, when it happened and any useful context..."></textarea></label>
<label>Attach photo<input type="file" name="photo" accept="image/png,image/jpeg,image/webp"></label>
<div class="location-consent"><label class="checkline"><input type="checkbox" id="shareLocation" name="shareLocation" required> I agree to share my current location (required).</label><button type="button" class="btn btn-soft" id="locateBtn">⌖ Get my location</button><span id="locationStatus" class="muted">Location is required for report submission. One-time location only.</span></div>
<input type="hidden" name="latitude" id="latitude"><input type="hidden" name="longitude" id="longitude">
<button class="btn btn-primary" type="submit">Submit report ↗</button><a class="text-link" href="/dashboard">Cancel</a></form></main><script src="/js/location.js"></script>
<script>
document.querySelector('.form-panel').addEventListener('submit', function(e){
 const lat=document.getElementById('latitude').value, lon=document.getElementById('longitude').value;
 if(!lat || !lon){e.preventDefault();document.getElementById('locationStatus').textContent='Please click Get my location and allow location access before submitting.';}
});
</script></body></html>
